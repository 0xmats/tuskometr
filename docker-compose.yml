name: tuskometr-dev

services:
  youtube-egress:
    profiles: ["egress"]
    build: ./deploy/youtube-egress
    image: tuskometr-youtube-egress:local
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=1m,mode=1777
    environment:
      EGRESS_BIND_ADDRESS: ${EGRESS_BIND_ADDRESS:-127.0.0.1}
      EGRESS_CLIENT_ADDRESS: ${EGRESS_CLIENT_ADDRESS:-127.0.0.1}

  web:
    build:
      context: .
      target: web
    image: tuskometr-web:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - dashboard-data:/snapshots:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: runtime
    image: tuskometr:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: sqlite:////data/tuskometr.db
    volumes:
      - ./apps/api/alembic:/app/apps/api/alembic:ro
      - ./apps/api/alembic.ini:/app/apps/api/alembic.ini:ro
      - app-data:/data

  publisher:
    image: tuskometr:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.publisher"]
    environment:
      DASHBOARD_STORAGE: local
      DATABASE_URL: sqlite:////data/tuskometr.db
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      HEALTHCHECKS_PUBLISHING_URL: ${HEALTHCHECKS_PUBLISHING_URL:-}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-30}
      DASHBOARD_MAX_STALE_SECONDS: ${DASHBOARD_MAX_STALE_SECONDS:-120}
      DASHBOARD_RETENTION_SECONDS: ${DASHBOARD_RETENTION_SECONDS:-900}
    volumes:
      - ./apps/api/app:/app/apps/api/app:ro
      - app-data:/data
      - dashboard-data:/snapshots

  worker:
    image: tuskometr:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: sqlite:////data/tuskometr.db
      HEALTHCHECKS_COLLECTING_URL: ${HEALTHCHECKS_COLLECTING_URL:-}
      SOURCE_MODE: ${SOURCE_MODE:-youtube}
      SOURCE_URL: ${SOURCE_URL:-https://www.youtube.com/watch?v=dzntyCTgJMQ}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_PROVIDER: ${ASR_PROVIDER:-local}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_API_BASE_URL: ${ASR_API_BASE_URL:-https://oai.endpoints.kepler.ai.cloud.ovh.net/v1}
      ASR_API_MODEL: ${ASR_API_MODEL:-whisper-large-v3-turbo}
      ASR_API_TIMEOUT_SECONDS: ${ASR_API_TIMEOUT_SECONDS:-60}
      ASR_FALLBACK_MODEL: ${ASR_FALLBACK_MODEL:-base}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-4}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-3}
      ASR_HOTWORDS_VERIFY: ${ASR_HOTWORDS_VERIFY:-true}
      CHUNK_SECONDS: ${CHUNK_SECONDS:-25}
      CHUNK_STEP_SECONDS: ${CHUNK_STEP_SECONDS:-20}
      SAMPLE_RATE: ${SAMPLE_RATE:-16000}
      MAX_AUDIO_QUEUE_SECONDS: ${MAX_AUDIO_QUEUE_SECONDS:-90}
      YOUTUBE_DVR_ENABLED: ${YOUTUBE_DVR_ENABLED:-true}
      YOUTUBE_DVR_HOURS: ${YOUTUBE_DVR_HOURS:-12}
      YOUTUBE_DVR_CATCHUP_CHUNK_SECONDS: ${YOUTUBE_DVR_CATCHUP_CHUNK_SECONDS:-300}
      YOUTUBE_HISTORY_ENABLED: ${YOUTUBE_HISTORY_ENABLED:-true}
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
      HF_HOME: /models/huggingface
    volumes:
      - ./apps/api/app:/app/apps/api/app:ro
      - app-data:/data
      - model-cache:/models

  backup:
    image: tuskometr:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.backup"]
    environment:
      DATABASE_URL: sqlite:////data/tuskometr.db
      BACKUP_DIR: /backups
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - app-data:/data
      - backup-data:/backups

  benchmark:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    image: tuskometr:dev
    entrypoint: ["python", "-m", "app.benchmark"]
    environment:
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-4}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-3}
      ASR_HOTWORDS_VERIFY: ${ASR_HOTWORDS_VERIFY:-true}
      CHUNK_SECONDS: ${CHUNK_SECONDS:-25}
      CHUNK_STEP_SECONDS: ${CHUNK_STEP_SECONDS:-20}
      SAMPLE_RATE: ${SAMPLE_RATE:-16000}
      HF_HOME: /models/huggingface
    volumes:
      - model-cache:/models
      - ./benchmark/samples:/samples:ro

volumes:
  app-data:
  model-cache:
  backup-data:
  dashboard-data:
