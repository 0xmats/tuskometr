services:
  web:
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/Caddyfile.web:/etc/caddy/Caddyfile:ro

  migrate:
    volumes:
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro

  publisher:
    volumes:
      - ./backend/app:/app/app:ro

  worker:
    volumes:
      - app-data:/data
      - model-cache:/models
      - ./backend/app:/app/app:ro
