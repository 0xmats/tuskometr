name: Build, Test and Deploy
run-name: Production release ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      initialize_backups:
        description: Initialize a new empty backup repository (first deployment only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      IMAGE: ${{ needs.build.outputs.image }}
      VITE_DATA_ORIGIN: ${{ vars.VITE_DATA_ORIGIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for key in VPS_HOST VPS_USER VPS_PORT VITE_DATA_ORIGIN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT CF_TOKEN SSH_KEY; do
            test -n "${!key}" || { echo "Missing setting: $key" >&2; exit 1; }
          done
          [[ "$VITE_DATA_ORIGIN" =~ ^https://[^/]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9-]+$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build:web
      - name: Upload release files
        run: |
          remote="$VPS_USER@$VPS_HOST"
          directory="/opt/tuskometr/releases/$GITHUB_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$remote" "mkdir -p '$directory/scripts' '$directory/deploy'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" docker-compose.prod.yml "$remote:$directory/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" scripts/deploy-production.sh scripts/restore-sqlite.sh "$remote:$directory/scripts/"
      - name: Deploy backend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIALIZE_BACKUPS: ${{ inputs.initialize_backups }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "bash /opt/tuskometr/releases/$GITHUB_SHA/scripts/deploy-production.sh '$IMAGE' '$GITHUB_ACTOR' '$INITIALIZE_BACKUPS'"
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
      - name: Release summary
        run: |
          {
            echo "Deployed commit: $GITHUB_SHA"
            echo "Backend image: $IMAGE"
            echo "Pages project: $CLOUDFLARE_PAGES_PROJECT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
