name: tuskometr

services:
  youtube-tokens:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    build:
      context: .
      target: runtime
    image: ${TUSKOMETR_IMAGE:-tuskometr:production}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: sqlite:////data/tuskometr.db
    volumes:
      - app-data:/data

  publisher:
    image: ${TUSKOMETR_IMAGE:-tuskometr:production}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.publisher"]
    environment:
      DASHBOARD_STORAGE: r2
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?Set R2_ENDPOINT_URL}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      R2_RETENTION_SECONDS: ${R2_RETENTION_SECONDS:-86400}
      DATABASE_URL: sqlite:////data/tuskometr.db
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-30}
      DASHBOARD_MAX_STALE_SECONDS: ${DASHBOARD_MAX_STALE_SECONDS:-120}
      DASHBOARD_RETENTION_SECONDS: ${DASHBOARD_RETENTION_SECONDS:-900}
    volumes:
      - app-data:/data
      - dashboard-data:/snapshots

  worker:
    image: ${TUSKOMETR_IMAGE:-tuskometr:production}
    restart: unless-stopped
    depends_on:
      youtube-tokens:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: sqlite:////data/tuskometr.db
      SOURCE_MODE: ${SOURCE_MODE:-youtube}
      SOURCE_URL: ${SOURCE_URL:-https://www.youtube.com/watch?v=dzntyCTgJMQ}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_PROVIDER: ${ASR_PROVIDER:-local}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_API_BASE_URL: ${ASR_API_BASE_URL:-https://oai.endpoints.kepler.ai.cloud.ovh.net/v1}
      ASR_API_MODEL: ${ASR_API_MODEL:-whisper-large-v3}
      ASR_API_TIMEOUT_SECONDS: ${ASR_API_TIMEOUT_SECONDS:-60}
      ASR_FALLBACK_MODEL: ${ASR_FALLBACK_MODEL:-base}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-4}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-3}
      ASR_HOTWORDS_VERIFY: ${ASR_HOTWORDS_VERIFY:-true}
      CHUNK_SECONDS: ${CHUNK_SECONDS:-25}
      CHUNK_STEP_SECONDS: ${CHUNK_STEP_SECONDS:-20}
      SAMPLE_RATE: ${SAMPLE_RATE:-16000}
      MAX_AUDIO_QUEUE_SECONDS: ${MAX_AUDIO_QUEUE_SECONDS:-90}
      YTDLP_POT_PROVIDER_URL: http://youtube-tokens:4416
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      HF_HOME: /models/huggingface
    volumes:
      - app-data:/data
      - model-cache:/models

  backup:
    image: ${TUSKOMETR_IMAGE:-tuskometr:production}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.backup"]
    env_file:
      - ${TUSKOMETR_BACKUP_ENV_FILE:-./deploy/backup.env}
    environment:
      BACKUP_REMOTE_ENABLED: "true"
      DATABASE_URL: sqlite:////data/tuskometr.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - app-data:/data
      - backup-data:/backups


volumes:
  app-data:
  model-cache:
  backup-data:
  dashboard-data:
